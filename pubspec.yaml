name: alionhr
description: "Alien HR Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/alien_logo.png
# Native splash screen configuration
flutter_native_splash:
  color: "#FFFFFF"

  android: true
  ios: true
  web: false

  # Android 12 and newer
  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"