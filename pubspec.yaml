name: alionhr
description: "Alien HR Mobile Application"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  
  geolocator: ^14.0.2

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "lib/assets/images/alien_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0614"
  adaptive_icon_foreground: "lib/assets/images/alien_logo.png"

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/alien_logo.png
# Native splash screen configuration
flutter_native_splash:
  color: "#0B0614"
  image: "lib/assets/images/alien_logo.png"

  android: true
  ios: true
  web: false

  # Android 12 and newer
  android_12:
    color: "#0B0614"
    image: "lib/assets/images/alien_logo.png"
    icon_background_color: "#0B0614"